name: NeuralChat CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  engine-validation:
    name: Core Engine & Markdown Security Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run NeuralChat Test Suite
        run: |
          python -m unittest discover -s tests -p "test_*.py"

  html-validation:
    name: HTML & Asset Integrity Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check HTML syntax & required files
        run: |
          test -f index.html
          test -f css/style.css
          test -f js/chat.js
          test -f LICENSE
          echo "All static assets verified successfully."
